# Include inside the existing HTTPS server block, not at http scope.
# Build the frontend with APP_BASE_PATH=/ancient_tree/ and set COOKIE_SECURE=true.
location = /ancient_tree {
    return 308 /ancient_tree/;
}

location ^~ /ancient_tree/ {
    # The trailing slash removes the public prefix before reaching the app.
    proxy_pass http://127.0.0.1:18080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_cookie_path / /ancient_tree/;
    proxy_buffering off;
    proxy_read_timeout 240s;
    proxy_send_timeout 240s;
    client_max_body_size 32k;
}
